[package]
name = "secutest-backend"
version = "0.1.0"
edition = "2021"
description = "Scan orchestration, result storage, and API services for the Secutest leak-detection platform"
license = "MIT"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "net"] }

# Web framework - Fixed RUSTSEC-2026-0258 via h2 upgrade, RUSTSEC-2024-0436 via actix-web upgrade
# Using rustls-0_23 feature to pull secure rustls >=0.23.46 (fixes RUSTSEC-2024-0336, RUSTSEC-2026-0349)
actix-web = { version = "4.10", default-features = false, features = ["macros", "compress-brotli", "compress-gzip", "compress-zstd", "cookies", "unicode", "compat", "ws", "rustls-0_23"] }
actix-cors = "0.7"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Identifiers and timestamps - Fixed RUSTSEC-2020-0071, RUSTSEC-2023-0049 via chrono 0.4.38
uuid = { version = "0.8", features = ["v4", "serde"] }
chrono = { version = "0.4.38", features = ["serde"] }

# URL handling and IP classification for target validation
url = "2"

# HTTP client used by the default scanner - Fixed RUSTSEC-2023-0071, RUSTSEC-2024-0436 via reqwest 0.12.14
reqwest = { version = "0.12.14", default-features = false, features = ["rustls-tls", "json", "charset"] }

# Force secure h2 version (actix-http 3.19 uses h2 0.3.27 which has RUSTSEC-2026-0258)
h2 = "0.4"

# Async traits and stream helpers
async-trait = "0.1"
futures-util = "0.3"

# Error handling
thiserror = "2"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
actix-rt = "2"
actix-web = { version = "4.10", default-features = false, features = ["macros", "compress-brotli", "compress-gzip", "compress-zstd", "cookies", "unicode", "compat", "ws", "rustls-0_23"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "signal"] }
uuid = { version = "0.8", features = ["v4", "serde"] }
chrono = { version = "0.4.38", features = ["serde"] }
serde_json = "1"
reqwest = { version = "0.12.14", default-features = false, features = ["rustls-tls", "json", "charset"] }
mockito = "1.7.2"

# Pin getrandom to 0.2 for Windows MSVC compatibility (avoid dlltool)
getrandom = { version = "0.2", features = ["rdrand"] }

# Security: pin secure versions of transitive dependencies
# RUSTSEC-2025-0009: ring AES panic - upgrade to >=0.17.12
ring = "0.17.14"
# RUSTSEC-2024-0336, RUSTSEC-2026-0349: rustls vulnerabilities - upgrade to >=0.23.46
rustls = "0.23.46"
# RUSTSEC-2026-0381: webpki-roots emSign distrust - upgrade to >=1.0.10
webpki-roots = "1.0.10"